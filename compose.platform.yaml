name: platform
services:
  cs-viewer-web:
    image: platform/cs-viewer:${CS_VIEWER_IMAGE_TAG:-ubuntu26.04-20261110-r11}
    container_name: cs-viewer-web
    user: "${CS_VIEWER_UID:-65532}:${CS_VIEWER_GID:-65532}"
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-platform/python314:ubuntu26.04-20261109-r2}
    pull_policy: never
    restart: unless-stopped
    ports: ['0.0.0.0:20035:8080']
    networks: [cs-viewer-private]
    environment:
      CS_AGENT_URL: http://host.docker.internal:20135
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    labels:
      com.cs-viewer.module: cs-viewer
      com.cs-viewer.role: web
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
networks:
  cs-viewer-private:
    name: platform_cs-viewer
